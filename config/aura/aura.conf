#  aura — configuracion
# =============================================================
#  Este archivo lo carga ~/.local/bin/aura al arrancar. Todo lo que
#  este aqui se puede sobreescribir con variables de entorno:
#
#      THEME=0 aura start        # arranca sin tocar los colores
#      AURA_LIST_MAX=20 aura switcher
#
#  No hace falta tocar theme-config.bash: aura escribe en los archivos
#  que generan tus modulos y avisa a cada app por senal, igual que
#  hacen tus scripts 04-*/05-*.
# =============================================================

# ── Pool de wallpapers ───────────────────────────────────────
# Carpetas de donde se saca el material. Se recorren en orden.
#  $HOME  y  $RICE  se expanden solas ($RICE = rice activa).
POOL=(
    "$HOME/.config/bspwm/rices/$RICE/walls"
    "$HOME/.config/bspwm/config/assets"
    "$HOME/Wallpapers/Videos"
)
# Cuantas carpetas hacia abajo se busca en cada una
POOL_DEPTH=2
# Que muestra el switcher por defecto
KIND=video
# Cuantas filas caben en el menu (el resto se recorta, y el recorte
# hace que el preview que sigue al raton caiga siempre en la fila buena)
LIST_MAX=50

# ── Auto-theming ─────────────────────────────────────────────
# 0 = aura no toca ningun color
THEME=0
# A que se propaga el acento (separados por espacios)
#   bspwm polybar rofi dunst kitty ghostty mpv
THEME_TARGETS="bspwm polybar rofi dunst kitty ghostty mpv"
# Cada cuantos segundos se vuelve a mirar el video y se actualiza
THEME_INTERVAL=15
# Cambio minimo de color (0-255) para propagar. Evita parpadeos.
THEME_MIN_DELTA=7
# Claves del [color] de polybar (config.ini de la rice) que reciben el acento
POLYBAR_KEYS="bc"
# Suavizado del color: cuanto mas alto, mas se resiste a cambiar rapido
SMOOTH=40
# Segundo del video del que se saca el acento al aplicar (luego el
# guard lo va siguiendo conforme avanza la reproduccion)
FRAME_TIME=2

# ── Comportamiento del motor ─────────────────────────────────
# Pausar solo cuando algo va en pantalla completa
AUTO_PAUSE=1
# Pausar cuando la bateria baja de BATTERY_PAUSE_BELOW
BATTERY_PAUSE=1
BATTERY_PAUSE_BELOW=60
# Clases que pausan aunque no usen pantalla completa (regex, | alterna)
GAME_CLASSES="steam|lutris|heroic|gamescope|retroarch"
# Arrancar en pausa
START_PAUSED=0
# Cuanto espera el guard entre comprobaciones
AURA_TICK=2

# ── Switcher ─────────────────────────────────────────────────
# Margen en px entre el menu y el preview
SWITCHER_MARGIN=30
# Cada cuantos ms sigue el preview al raton
FOLLOW_MS=0.09
# Medidas del menu. OJO: rofi 2.0 ignora element{height}/inputbar{height},
# asi que el alto de fila se deduce de la ventana real
# (aura_switcher_row_height) y AURA_ROW_H es solo un fallback.
# AURA_INPUTBAR_H si hay que mantenerlo al dia:
#   inputbar = 16 (linea de texto) + 2 * inputbar.padding vertical
AURA_INPUTBAR_H=38
AURA_ROW_H=46

# ── Caché ────────────────────────────────────────────────────
# Miniaturas mas viejas que esto se borran
THUMB_GC_DAYS=30
DYNAMIC_BG=1
